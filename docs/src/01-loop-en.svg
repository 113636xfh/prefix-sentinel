<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" font-family="'Noto Sans CJK SC','Noto Sans',sans-serif">
  <rect x="0" y="0" width="1280" height="360" fill="#ffffff"/>

  <text x="640" y="52" font-size="26" font-weight="bold" fill="#1a202c" text-anchor="middle">One Request, One Line</text>
  <text x="640" y="86" font-size="15" fill="#5a6a80" text-anchor="middle">Every inference request the pi process sends passes through here: capture, compare, record</text>

  <!-- node 1: fetch (gray) -->
  <rect x="40" y="140" width="240" height="88" rx="10" fill="#f7f9fb" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="170" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">Outbound fetch</text>
  <text x="160" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">any inference request</text>

  <!-- node 2: capture (green) -->
  <rect x="360" y="140" width="240" height="88" rx="10" fill="#eefaf3" stroke="#22a06b" stroke-width="2"/>
  <text x="480" y="170" font-size="20" font-weight="bold" fill="#1e7a4c" text-anchor="middle">Capture wire body</text>
  <text x="480" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">not consumed, not altered</text>

  <!-- node 3: compare (orange = core) -->
  <rect x="680" y="140" width="240" height="88" rx="10" fill="#fdeacc" stroke="#e8850c" stroke-width="2"/>
  <text x="800" y="170" font-size="20" font-weight="bold" fill="#9a4d00" text-anchor="middle">diff + classify</text>
  <text x="800" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">against previous full body</text>

  <!-- node 4: log (blue) -->
  <rect x="1000" y="140" width="240" height="88" rx="10" fill="#eef3fb" stroke="#3b82c4" stroke-width="2"/>
  <text x="1120" y="170" font-size="20" font-weight="bold" fill="#1d4f8a" text-anchor="middle">one log.jsonl line</text>
  <text x="1120" y="198" font-size="15" fill="#5a6a80" text-anchor="middle">classification + full diff</text>

  <!-- arrows: edge center to edge center, mid-height y=184 -->
  <line x1="280" y1="184" x2="346" y2="184" stroke="#718096" stroke-width="2.5"/>
  <polygon points="346,176 346,192 360,184" fill="#718096"/>
  <line x1="600" y1="184" x2="666" y2="184" stroke="#718096" stroke-width="2.5"/>
  <polygon points="666,176 666,192 680,184" fill="#718096"/>
  <line x1="920" y1="184" x2="986" y2="184" stroke="#718096" stroke-width="2.5"/>
  <polygon points="986,176 986,192 1000,184" fill="#718096"/>

  <!-- loop return: node 4 bottom center -> node 1 bottom center (dashed) -->
  <path d="M 1120,228 L 1120,300 L 160,300 L 160,242" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <polygon points="152,242 168,242 160,228" fill="#94a3b8"/>
  <text x="640" y="330" font-size="15" fill="#5a6a80" text-anchor="middle">every request records one line; the next request diffs against it</text>
</svg>
